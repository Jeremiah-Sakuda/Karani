[project]
name = "karani"
version = "1.2.0"
description = "An autonomous overnight batch agent that prepares grading evidence and cannot issue a grade."
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }

# Dependency discipline: the runtime model surface is Google only. There is no
# Anthropic, OpenAI, or other third-party model client in this dependency tree, in
# any environment, at any time (AGENTS.md). If one appears here, that is a defect.
dependencies = [
  "pydantic>=2.9,<3",
  "google-genai>=1.0,<2",
  "google-adk>=1.0,<2",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-storage>=2.18,<3",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "python-docx>=1.1,<2",
  "pypdf>=5.1,<6",
  "jinja2>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyyaml>=6.0,<7",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "reportlab>=4.2,<5",
]

[project.scripts]
karani = "karani.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "deployed: requires a deployed Google Cloud path and real credentials",
  "live: makes real Vertex AI model calls and costs money",
  "emulator: requires the Firestore emulator (and therefore Java)",
]
# The default run excludes everything that needs credentials or money. `make test`
# must pass on a clean clone with no cloud access at all.
addopts = "-m 'not deployed and not live and not emulator' -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
