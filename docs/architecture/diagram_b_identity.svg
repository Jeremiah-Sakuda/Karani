<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Karani identity boundaries: five service accounts, what each may do, and what each is denied</title>
  <desc>Five per-stage service accounts. Ingest may read the source bucket only. Analysis may invoke Vertex AI and create events, and is denied event update, event delete, and any write to grades. Render may read events and write artifacts and is denied model access. Delivery holds the drive.file scope for one folder and is denied reading the instructor's wider Drive. The docket may read events and is denied grade writes. No service account can write to the grades collection; that denial is asserted both in the emulator and on the deployed path.</desc>

  <defs>
    <style>
      .bg   { fill:#fbfaf8 }
      .sa   { fill:#ffffff; stroke:#9aa7bb; stroke-width:1.6; rx:6 }
      .grant{ fill:#f1f4f8; stroke:#c9c3b8; stroke-width:1; rx:4 }
      .deny { fill:#ffffff; stroke:#7a7a7a; stroke-width:1.4; stroke-dasharray:5 4; rx:4 }
      .lbl  { font-size:13px; fill:#1f2328; font-weight:600 }
      .mono { font-size:10.5px; fill:#5b6675; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
      .monod{ font-size:10.5px; fill:#4a4a4a; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
      .cap  { font-size:11px; fill:#6b6b6b }
      .title{ font-size:19px; fill:#1f2328; font-weight:700 }
      .sect { font-size:10.5px; fill:#8a8a8a; font-family:ui-monospace,Menlo,monospace; letter-spacing:.09em }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>

  <text class="title" x="40" y="42">What each identity may do — and what it is denied</text>
  <text class="cap" x="40" y="62">Least privilege stated as an argument. Every denial below is executed as a test that asserts PERMISSION_DENIED (KAR-313); a documentation diff would prove only that someone wrote down an intention.</text>

  <text class="sect" x="40" y="104">GRANTED</text>
  <text class="sect" x="470" y="104">DENIED — AND ASSERTED, NOT ASSUMED</text>

  <!-- ============ karani-ingest ============ -->
  <rect class="sa" x="40" y="116" width="176" height="78"/>
  <text class="lbl" x="54" y="140">karani-ingest</text>
  <text class="mono" x="54" y="158">reads the source</text>
  <text class="mono" x="54" y="173">bucket. Nothing</text>
  <text class="mono" x="54" y="188">else.</text>
  <rect class="grant" x="232" y="128" width="212" height="26"/>
  <text class="mono" x="242" y="145">roles/storage.objectViewer</text>

  <rect class="deny" x="470" y="122" width="164" height="24"/><text class="monod" x="478" y="138">write an event</text>
  <rect class="deny" x="646" y="122" width="164" height="24"/><text class="monod" x="654" y="138">write grades/</text>
  <rect class="deny" x="822" y="122" width="164" height="24"/><text class="monod" x="830" y="138">call a model</text>
  <rect class="deny" x="470" y="154" width="164" height="24"/><text class="monod" x="478" y="170">create a Drive file</text>

  <!-- ============ karani-analysis ============ -->
  <rect class="sa" x="40" y="212" width="176" height="96"/>
  <text class="lbl" x="54" y="236">karani-analysis</text>
  <text class="mono" x="54" y="254">drafts observations</text>
  <text class="mono" x="54" y="269">and appends to the</text>
  <text class="mono" x="54" y="284">log. Writes it —</text>
  <text class="mono" x="54" y="299">cannot rewrite it.</text>
  <rect class="grant" x="232" y="220" width="212" height="26"/>
  <text class="mono" x="242" y="237">roles/aiplatform.user</text>
  <rect class="grant" x="232" y="254" width="212" height="26"/>
  <text class="mono" x="242" y="271">karaniAppendOnly</text>
  <text class="mono" x="242" y="296">create + get, no update/delete</text>

  <rect class="deny" x="470" y="212" width="164" height="24"/><text class="monod" x="478" y="228">update an event</text>
  <rect class="deny" x="646" y="212" width="164" height="24"/><text class="monod" x="654" y="228">delete an event</text>
  <rect class="deny" x="822" y="212" width="164" height="24"/><text class="monod" x="830" y="228">write to a bucket</text>
  <rect class="deny" x="470" y="244" width="340" height="24" stroke-width="2"/>
  <text class="monod" x="478" y="260" font-weight="700">write grades/  —  filmed on camera, deployed path</text>
  <rect class="deny" x="822" y="244" width="164" height="24"/><text class="monod" x="830" y="260">create a Drive file</text>
  <text class="mono" x="470" y="290">This is the identity a viewer would most expect to be able to grade —</text>
  <text class="mono" x="470" y="305">which is exactly why it is the one shown being refused.</text>

  <!-- ============ karani-render ============ -->
  <rect class="sa" x="40" y="326" width="176" height="78"/>
  <text class="lbl" x="54" y="350">karani-render</text>
  <text class="mono" x="54" y="368">folds the log into</text>
  <text class="mono" x="54" y="383">artifacts. Derives;</text>
  <text class="mono" x="54" y="398">never generates.</text>
  <rect class="grant" x="232" y="334" width="212" height="26"/>
  <text class="mono" x="242" y="351">karaniAppendOnly</text>
  <rect class="grant" x="232" y="368" width="212" height="26"/>
  <text class="mono" x="242" y="385">roles/storage.objectCreator</text>

  <rect class="deny" x="470" y="326" width="200" height="24"/><text class="monod" x="478" y="342">call a model</text>
  <rect class="deny" x="682" y="326" width="164" height="24"/><text class="monod" x="690" y="342">write grades/</text>
  <rect class="deny" x="858" y="326" width="164" height="24"/><text class="monod" x="866" y="342">update an event</text>
  <text class="mono" x="470" y="368">An identity that could call a model could produce an artifact instead of folding one — and the replay test's</text>
  <text class="mono" x="470" y="383">byte-stability guarantee would then be asserting only that a generated artifact happened to be reproducible.</text>

  <!-- ============ karani-delivery ============ -->
  <rect class="sa" x="40" y="422" width="176" height="78"/>
  <text class="lbl" x="54" y="446">karani-delivery</text>
  <text class="mono" x="54" y="464">writes one folder</text>
  <text class="mono" x="54" y="479">in the instructor's</text>
  <text class="mono" x="54" y="494">real Drive.</text>
  <rect class="grant" x="232" y="440" width="212" height="26"/>
  <text class="mono" x="242" y="457">drive.file  (not drive)</text>

  <rect class="deny" x="470" y="422" width="216" height="24"/><text class="monod" x="478" y="438">list the instructor's Drive</text>
  <rect class="deny" x="698" y="422" width="150" height="24"/><text class="monod" x="706" y="438">write grades/</text>
  <rect class="deny" x="860" y="422" width="162" height="24"/><text class="monod" x="868" y="438">write an event</text>
  <text class="mono" x="470" y="464">drive.file grants access only to files this application itself created, so the credential cannot read what was</text>
  <text class="mono" x="470" y="479">already there. The broader scope would have been simpler — and is why Drive ingest was cut entirely.</text>

  <!-- ============ karani-docket ============ -->
  <rect class="sa" x="40" y="518" width="176" height="78"/>
  <text class="lbl" x="54" y="542">karani-docket</text>
  <text class="mono" x="54" y="560">serves the docket</text>
  <text class="mono" x="54" y="575">and the public</text>
  <text class="mono" x="54" y="590">challenge box.</text>
  <rect class="grant" x="232" y="536" width="212" height="26"/>
  <text class="mono" x="242" y="553">karaniAppendOnly</text>

  <rect class="deny" x="470" y="518" width="200" height="24"/><text class="monod" x="478" y="534">write grades/</text>
  <rect class="deny" x="682" y="518" width="164" height="24"/><text class="monod" x="690" y="534">update an event</text>
  <rect class="deny" x="858" y="518" width="164" height="24"/><text class="monod" x="866" y="534">call a model</text>
  <text class="mono" x="470" y="560">The docket is where an instructor ratifies — which makes this the identity someone would most plausibly grant</text>
  <text class="mono" x="470" y="575">grade access to as a convenience. The ratification write goes through the instructor's own session instead.</text>

  <!-- ============ footer ============ -->
  <line x1="40" y1="622" x2="1140" y2="622" stroke="#ddd8cf" stroke-width="1"/>
  <text class="cap" x="40" y="644">Two mechanisms, because each is invisible to the other's test: Firestore rules cover the browser path; the custom IAM role covers the service-account path.</text>
  <text class="cap" x="40" y="661">A service account using the server SDK never evaluates Firestore rules, and an emulator never evaluates IAM. Asserting only one would report a green boundary with the other side open.</text>
  <text class="cap" x="40" y="678">Standing rule: never widen a scope to unblock a deploy. A failing deploy with correct permissions beats a passing deploy with wrong ones.</text>
  <text class="cap" x="40" y="700">Source: deploy/iam/negative-matrix.yaml — read directly by tests/test_iam_boundary.py.  Every number traces to docs/metrics.json.</text>
</svg>
