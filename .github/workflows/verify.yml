name: verify

on:
  push:
    branches: [main]
  pull_request:

# The whole point of this workflow is that it runs with no Google credentials and no
# secrets configured. If a test needs a credential to pass, it is marked `deployed`,
# `live`, or `emulator` and is excluded here by pyproject's default `addopts`. A green
# check on this workflow therefore means: a stranger can clone this and it works.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compliance — no orphaned requirement IDs, no range notation
        run: python scripts/compliance.py

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Types
        run: mypy

      - name: Tests (no credentials, no emulator, no model calls)
        run: pytest

      - name: Replay determinism — fold a shuffled log with the environment stripped
        # KAR-103's property, asserted in the harshest available environment: every
        # Google credential variable explicitly cleared, so a render() that reached for
        # the network would fail rather than quietly succeed on an inherited token.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
          GOOGLE_CLOUD_PROJECT: ""
          GOOGLE_API_KEY: ""
          FIRESTORE_EMULATOR_HOST: ""
        run: pytest tests/test_replay.py -v

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
